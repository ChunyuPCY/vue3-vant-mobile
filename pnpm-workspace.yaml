shamefullyHoist: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - tinyexec@1.2.2
  - 'semver@6.3.1 || 5.7.2'
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'

# Monorepo packages
packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/config/*'

overrides:
  source-map: ^0.7.6

allowBuilds:
  core-js: true
  esbuild: true
  simple-git-hooks: true

catalogs:
  dev:
    '@iconify-json/carbon': ^1.2.23
    '@intlify/unplugin-vue-i18n': ^11.2.4
    '@vant/auto-import-resolver': ^1.3.0
    '@vitejs/plugin-legacy': ^8.0.2
    '@vitejs/plugin-vue': ^6.0.7
    tsdown: ^0.16.7
    turbo: ^2.0.0
    typescript: ^6.0.3
    unocss: 66.7.2
    unplugin-auto-import: ^21.0.0
    unplugin-vue-components: ^32.1.0
    vite: ^8.0.16
    vite-plugin-mock-dev-server: ^2.4.1
    vite-plugin-pwa: ^1.3.0
    vite-plugin-sitemap: ^0.8.2
    vite-plugin-vconsole: ^2.1.1
    vite-plugin-vue-devtools: ^8.1.3
    vue-tsc: ^3.3.5
  frontend:
    '@types/lodash-es': ^4.17.12
    '@types/node': ^26.0.0
    '@types/nprogress': ^0.2.3
    autoprefixer: ^10.5.0
    cross-env: ^10.1.0
    less: ^4.6.6
    mockjs: ^1.1.0
    postcss-mobile-forever: ^5.0.0

  git:
    '@commitlint/cli': ^21.0.2
    '@commitlint/config-conventional': ^21.0.2
    '@commitlint/types': ^21.0.1
    bumpp: ^11.1.0
    lint-staged: ^17.0.8
    simple-git-hooks: ^2.13.1

  lint:
    '@antfu/eslint-config': 9.0.0
    '@unocss/eslint-config': 66.7.2
    eslint: ^10.5.0
    eslint-plugin-format: ^2.0.1
    prettier: ^3.0.0

  prod:
    '@unhead/vue': 3.1.4
    '@vant/touch-emulator': ^1.5.0
    '@vant/use': ^1.6.0
    '@vueuse/core': ^14.3.0
    axios: ^1.18.0
    echarts: ^6.1.0
    lodash-es: ^4.18.1
    nprogress: ^0.2.0
    pinia: ^3.0.4
    pinia-plugin-persistedstate: ^4.7.1
    resize-detector: ^0.3.0
    vant: ^4.9.24
    vconsole: ^3.15.1
    vue: ^3.5.38
    vue-i18n: ^11.4.6
    vue-router: ^5.1.0

peerDependencyRules:
  allowedVersions:
    vite: ^8.0.14
